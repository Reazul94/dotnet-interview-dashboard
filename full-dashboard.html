<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="both">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Dashboard — .NET / ASP.NET Core Revision</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme Variables */
            --bg-primary-light: #f8fafc;
            --bg-secondary-light: #ffffff;
            --bg-tertiary-light: #f1f5f9;
            --text-primary-light: #0f172a;
            --text-secondary-light: #475569;
            --text-muted-light: #64748b;
            --border-light: #e2e8f0;

            /* Dark Theme Variables */
            --bg-primary-dark: #0b0f19;
            --bg-secondary-dark: #131b2e;
            --bg-tertiary-dark: #1e293b;
            --text-primary-dark: #f8fafc;
            --text-secondary-dark: #94a3b8;
            --text-muted-dark: #64748b;
            --border-dark: #1e293b;

            /* Brand Accent Colors */
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-bn: #38bdf8;

            /* Active Theme Defaults */
            --bg-primary: var(--bg-primary-dark);
            --bg-secondary: var(--bg-secondary-dark);
            --bg-tertiary: var(--bg-tertiary-dark);
            --text-primary: var(--text-primary-dark);
            --text-secondary: var(--text-secondary-dark);
            --text-muted: var(--text-muted-dark);
            --border-color: var(--border-dark);

            --sidebar-width: 280px;
            --header-height: 70px;
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        [data-theme="light"] {
            --bg-primary: var(--bg-primary-light);
            --bg-secondary: var(--bg-secondary-light);
            --bg-tertiary: var(--bg-tertiary-light);
            --text-primary: var(--text-primary-light);
            --text-secondary: var(--text-secondary-light);
            --text-muted: var(--text-muted-light);
            --border-color: var(--border-light);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }

        body {
            font-family: 'Inter', 'Hind Siliguri', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 14px;
        }

        .bn-sub { display: block; font-family: 'Hind Siliguri', sans-serif; font-size: 12.5px; color: var(--accent-bn); margin-top: 4px; }
        [data-lang="eng"] .bn-sub { display: none !important; }
        [data-lang="ban"] .en-text { display: none !important; }

        .page-switcher-bar {
            background-color: var(--bg-tertiary);
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
        }

        .page-tab {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
            border-radius: var(--radius-md); font-size: 13px; font-weight: 700;
            text-decoration: none; color: var(--text-secondary); background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }
        .page-tab.active { background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue)); color: #ffffff; }

        .content-body { padding: 24px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; }
        .card-title { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 14px; }
    </style>
</head>
<body>
    <div class="page-switcher-bar">
        <a href="index.html" class="page-tab">🔥 HIGH PRIORITY (PAGE 1)</a>
        <a href="ecosystem.html" class="page-tab">🌐 ECOSYSTEM & TOOLS (PAGE 2)</a>
        <a href="full-dashboard.html" class="page-tab active">📑 ALL-IN-ONE VIEW</a>
    </div>

    <div class="content-body">
        <div class="card">
            <h1 class="card-title">📑 All-in-One Revision Dashboard</h1>
            <p>You can quickly switch between <strong><a href="index.html" style="color: var(--accent-purple);">High Priority Topics (Page 1)</a></strong> and <strong><a href="ecosystem.html" style="color: var(--accent-cyan);">Ecosystem & Practice Tools (Page 2)</a></strong> using the navigation tabs above!</p>
        </div>
    </div>
</body>
</html>
